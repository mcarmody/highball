<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Highball</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body, #map { height: 100%; margin: 0; background: #0b0f14; }
  /* Free OSM tiles inverted+hue-rotated to a dark theme — no API key needed.
     (Swapped in after CARTO's dark_all tiles started requiring a key.) */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }
  body { font-family: -apple-system, system-ui, sans-serif; color: #cbd5e1; }
  .leaflet-popup-content-wrapper { background: #111827; color: #e5e7eb; }
  .leaflet-popup-tip { background: #111827; }
  .train-label {
    background: rgba(11,15,20,0.85);
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 2px 6px;
    color: #7dd3fc;
    font-size: 11px;
    white-space: nowrap;
  }
  #hud {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(11,15,20,0.85); border: 1px solid #334155;
    border-radius: 6px; padding: 8px 12px; font-size: 13px;
  }
</style>
</head>
<body>
<div id="hud">Highball — live rail telemetry<br><span id="count">loading…</span></div>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const map = L.map('map', { zoomControl: true }).setView([39.5, -98.35], 4);

  // Standard OSM tiles, no key required, ever. Dark look comes from the
  // CSS filter above rather than a hosted dark tile style — CARTO's
  // dark_all tiles now require an API key and were showing a watermark.
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  // Markers live outside .leaflet-tile-pane, so counter-invert them back
  // to normal color so the CSS filter above doesn't also invert the dots.
  const style = document.createElement('style');
  style.textContent = '.leaflet-marker-pane, .leaflet-overlay-pane { filter: invert(1) hue-rotate(180deg); }';
  document.head.appendChild(style);

  let markers = L.layerGroup().addTo(map);

  // Amtraker sends CORS: * — fetch straight from the source in-browser,
  // no relay/backend needed for this prototype. Falls back to the
  // committed trains.geojson snapshot if the live API is unreachable.
  const AMTRAKER_URL = 'https://api-v3.amtraker.com/v3/trains';

  function toFeatures(raw) {
    const features = [];
    for (const trainNum in raw) {
      raw[trainNum].forEach(inst => {
        if (inst.lat == null || inst.lon == null) return;
        const stations = inst.stations || [];
        features.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [inst.lon, inst.lat] },
          properties: {
            train_num: trainNum,
            route: inst.routeName,
            heading: inst.heading,
            velocity: inst.velocity,
            origin: (stations[0] || {}).name,
            destination: (stations[stations.length - 1] || {}).name,
          }
        });
      });
    }
    return features;
  }

  function render(features) {
    markers.clearLayers();
    features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties;
      L.circleMarker([lat, lon], {
        radius: 5, color: '#7dd3fc', fillColor: '#38bdf8',
        fillOpacity: 0.9, weight: 1.5
      }).bindPopup(
        `<b>${p.route}</b> (Train ${p.train_num})<br>` +
        `${p.origin} → ${p.destination}<br>` +
        `Heading ${p.heading || '—'}, ${Math.round(p.velocity || 0)} mph`
      ).addTo(markers);
    });
    document.getElementById('count').textContent =
      features.length + ' trains tracking live · updated ' +
      new Date().toLocaleTimeString();
  }

  function loadTrains() {
    fetch(AMTRAKER_URL, { cache: 'no-store' })
      .then(r => r.json())
      .then(raw => render(toFeatures(raw)))
      .catch(err => {
        console.error('live fetch failed, falling back to snapshot', err);
        fetch('trains.geojson?_=' + Date.now())
          .then(r => r.json())
          .then(data => render(data.features))
          .catch(() => {
            document.getElementById('count').textContent = 'feed unavailable';
          });
      });
  }

  loadTrains();
  setInterval(loadTrains, 15000); // Amtraker updates roughly every ~1min server-side
</script>
</body>
</html>
